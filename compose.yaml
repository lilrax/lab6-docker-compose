
# Описываем два микросервиса, которые Docker запустит вместе.
services:

  # Микросервис хранения товаров.
  storage:

    # Собираем образ из папки storage.
    build:
      context: ./storage

    # Имя Docker-образа.
    image: lab6-storage:latest

    # Передаём настройки приложения.
    env_file:
      - ./storage/.env.example

    environment:
      # Разрешаем подключения внутри сети Docker.
      STORAGE_HOST: "0.0.0.0"

      # Файл базы SQLite находится на подключённом томе.
      STORAGE_DB_PATH: "data/items.db"

    # Пробрасываем порт Storage на компьютер.
    ports:
      - "8001:8001"

    # Подключаем постоянное хранилище SQLite.
    volumes:
      - storage_data:/app/data

    # Проверяем доступность Storage Service.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/openapi.json', timeout=3)"

      # Интервал между проверками.
      interval: 5s

      # Максимальное время выполнения проверки.
      timeout: 3s

      # Допустимое количество неудачных проверок.
      retries: 10

      # Время на первоначальный запуск приложения.
      start_period: 5s

  # Микросервис, принимающий запросы клиента.
  gateway:

    # Собираем образ из папки api-gateway.
    build:
      context: ./api-gateway

    # Имя Docker-образа.
    image: lab6-gateway:latest

    # Загружаем настройки API Gateway.
    env_file:
      - ./api-gateway/.env.example

    environment:
      # Разрешаем подключения внутри сети Docker.
      GATEWAY_HOST: "0.0.0.0"

      # Обращаемся к Storage по имени сервиса Docker,
      # а не через localhost.
      GATEWAY_STORAGE_URL: "http://storage:8001"

    # Порт 8080 компьютера направляем
    # на порт 8000 контейнера.
    ports:
      - "8080:8000"

    # Gateway запускается только после готовности Storage.
    depends_on:
      storage:
        condition: service_healthy

    # Проверяем доступность API Gateway.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=3)"

      # Интервал между проверками.
      interval: 5s

      # Максимальное время выполнения проверки.
      timeout: 3s

      # Допустимое количество неудачных проверок.
      retries: 10

      # Время на первоначальный запуск приложения.
      start_period: 5s

# Подключаем существующий Docker volume.
# Данные SQLite сохраняются при перезапуске
# и пересоздании контейнеров.
volumes:
  storage_data:
    external: true
    name: lab6-storage-data

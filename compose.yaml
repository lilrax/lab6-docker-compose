
# Описываем два микросервиса, которые Docker запустит вместе.
services:

  # Микросервис хранения товаров.
  storage:
    # Собираем образ из папки storage.
    build:
      context: ./storage

    # Имя Docker-образа.
    image: lab6-storage:latest

    # Передаём настройки приложения.
    env_file:
      - ./storage/.env.example

    environment:
      # Разрешаем подключения к Storage внутри сети Docker.
      STORAGE_HOST: "0.0.0.0"

      # Файл базы SQLite находится на подключённом томе.
      STORAGE_DB_PATH: "data/items.db"

    # Порт ноутбука 8001 связан с портом контейнера 8001.
    ports:
      - "8001:8001"

    # Подключаем постоянное хранилище SQLite.
    volumes:
      - storage_data:/app/data

    # Проверяем, готов ли Storage принимать HTTP-запросы.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/openapi.json', timeout=3)"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Микросервис, принимающий запросы клиента.
  gateway:
    # Собираем образ из папки api-gateway.
    build:
      context: ./api-gateway

    image: lab6-gateway:latest

    # Загружаем настройки API Gateway.
    env_file:
      - ./api-gateway/.env.example

    environment:
      GATEWAY_HOST: "0.0.0.0"

      # Обращаемся к Storage по имени сервиса Docker,
      # а не через localhost.
      GATEWAY_STORAGE_URL: "http://storage:8001"

    # Порт 8080 ноутбука направляем на порт 8000 контейнера.
    ports:
      - "8080:8000"

    # Gateway запускается после готовности Storage.
    depends_on:
      storage:
        condition: service_healthy


# Подключаем существующий Docker volume.
# Он уже содержит нашу базу SQLite с товаром Notebook.
volumes:
  storage_data:
    external: true
    name: lab6-storage-data
